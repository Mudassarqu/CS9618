<main class="wrap">
  <h1>My scores</h1>
  <p class="lead">Every quiz and practice question you mark is listed here (on this device). When your teacher has connected the Google Sheet, each score is also sent there with your name.</p>
  <div class="card"><div data-score-table></div>

<script>
document.getElementById("clear").onclick=()=>{ if(confirm("Delete all scores stored on this device? (Scores already sent to the teacher sheet are kept.)")){ localStorage.removeItem("cs9618_scores"); location.reload(); } };
